AWSTemplateFormatVersion: '2010-09-09'

Description: Kubernetes Assignment Infrastructure

Parameters:

  LatestUbuntuAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/22.04/stable/current/amd64/hvm/ebs-gp2/ami-id

  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName

Resources:

  K8SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Kubernetes Assignment Security Group

      SecurityGroupIngress:

        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0

        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0

        - IpProtocol: tcp
          FromPort: 6443
          ToPort: 6443
          CidrIp: 106.51.200.183/32

        - IpProtocol: tcp
          FromPort: 30000
          ToPort: 32767
          CidrIp: 0.0.0.0/0

  K8Role:
    Type: AWS::IAM::Role

    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:

          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly

  K8InstanceProfile:
    Type: AWS::IAM::InstanceProfile

    Properties:
      Roles:
        - !Ref K8Role

  K8Master:
    Type: AWS::EC2::Instance

    Properties:

      InstanceType: t3.small

      KeyName: !Ref KeyPairName
      
      ImageId: !Ref LatestUbuntuAmi

      IamInstanceProfile: !Ref K8InstanceProfile

      SecurityGroupIds:
        - !Ref K8SecurityGroup

      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
            DeleteOnTermination: true

      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -eux

          apt-get update -y

          swapoff -a
          sed -i '/ swap / s/^/#/' /etc/fstab

          cat <<EOF | tee /etc/modules-load.d/k8s.conf
          overlay
          br_netfilter
          EOF

          modprobe overlay
          modprobe br_netfilter

          cat <<EOF | tee /etc/sysctl.d/k8s.conf
          net.bridge.bridge-nf-call-ip6tables = 1
          net.bridge.bridge-nf-call-iptables = 1
          net.ipv4.ip_forward = 1
          EOF

          sysctl --system

          apt-get install -y \
            apt-transport-https \
            ca-certificates \
            curl \
            gpg

          mkdir -p /etc/apt/keyrings

          curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.30/deb/Release.key \
          | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg

          echo "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.30/deb/ /" \
          > /etc/apt/sources.list.d/kubernetes.list

          apt-get update -y

          apt-get install -y \
            docker.io \
            containerd \
            kubelet \
            kubeadm \
            kubectl

          apt-mark hold kubelet kubeadm kubectl

          systemctl enable docker
          systemctl start docker

          systemctl enable containerd
          systemctl restart containerd
          
          mkdir -p /etc/containerd

          containerd config default > /etc/containerd/config.toml

          sed -i 's/SystemdCgroup = false/SystemdCgroup = true/' \
          /etc/containerd/config.toml

          systemctl restart containerd
          
          kubeadm init \
            --pod-network-cidr=10.244.0.0/16

          mkdir -p /root/.kube

          cp /etc/kubernetes/admin.conf /root/.kube/config

          export KUBECONFIG=/etc/kubernetes/admin.conf

          until kubectl get nodes >/dev/null 2>&1
          do
          echo "Waiting for Kubernetes API..."
            sleep 15
          done

          kubectl taint nodes --all node-role.kubernetes.io/control-plane- || true

          kubectl apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml

          echo "Waiting for networking..."
          sleep 60

          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/cloud/deploy.yaml

          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
          
          mkdir -p /home/ubuntu/.kube

          cp /etc/kubernetes/admin.conf /home/ubuntu/.kube/config

          chown -R ubuntu:ubuntu /home/ubuntu/.kube

          mkdir -p /home/ubuntu/k8s
          chown -R ubuntu:ubuntu /home/ubuntu/k8s

          touch /tmp/k8s-ready

      Tags:
        - Key: Name
          Value: kube-master
          
  ECRRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: flask-k8s-app

      ImageTagMutability: MUTABLE

      ImageScanningConfiguration:
        ScanOnPush: false

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: kubernetes-alerts

  AlertSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: sushms1014@gmail.com

  HighCPUAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: KubernetesHighCPU

      Namespace: AWS/EC2
      MetricName: CPUUtilization

      Dimensions:
        - Name: InstanceId
          Value: !Ref K8Master

      Statistic: Average
      Period: 300

      EvaluationPeriods: 1

      Threshold: 70

      ComparisonOperator: GreaterThanThreshold

      AlarmActions:
        - !Ref AlertTopic

  EC2StatusCheckAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: KubernetesStatusCheckFailed

      Namespace: AWS/EC2
      MetricName: StatusCheckFailed

      Dimensions:
        - Name: InstanceId
          Value: !Ref K8Master

      Statistic: Maximum

      Period: 60

      EvaluationPeriods: 1

      Threshold: 1

      ComparisonOperator: GreaterThanOrEqualToThreshold

      AlarmActions:
        - !Ref AlertTopic

  LambdaRole:
    Type: AWS::IAM::Role

    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'

        Statement:
          - Effect: Allow

            Principal:
               Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      Policies:
        - PolicyName: DynamoDBAccess

          PolicyDocument:
            Version: '2012-10-17'

            Statement:
              - Effect: Allow

                Action:
                  - dynamodb:PutItem

                Resource: !GetAtt AlarmEventsTable.Arn

  AlertLambda:
    Type: AWS::Lambda::Function

    Properties:
      FunctionName: KubernetesAlertHandler

      Runtime: python3.12

      Handler: index.lambda_handler

      Role: !GetAtt LambdaRole.Arn

      Timeout: 30

      Code:
        ZipFile: |
          import json
          import boto3
          import uuid
          from datetime import datetime

          dynamodb = boto3.resource("dynamodb")

          table = dynamodb.Table("kubernetes-alarm-events")

          def lambda_handler(event, context):

              table.put_item(
                  Item={
                      "EventId": str(uuid.uuid4()),
                      "Timestamp": datetime.utcnow().isoformat(),
                      "Payload": json.dumps(event)
                  }
              )

              print("Alarm event written to DynamoDB")

              return {
                  "statusCode": 200
              }
              
  AlarmEventsTable:
    Type: AWS::DynamoDB::Table

    Properties:
      TableName: kubernetes-alarm-events

      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: EventId
          AttributeType: S

      KeySchema:
        - AttributeName: EventId
          KeyType: HASH
          
  LambdaSubscription:
    Type: AWS::SNS::Subscription

    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: lambda
      Endpoint: !GetAtt AlertLambda.Arn

  LambdaPermission:
    Type: AWS::Lambda::Permission

    Properties:
      FunctionName: !Ref AlertLambda

      Action: lambda:InvokeFunction

      Principal: sns.amazonaws.com

      SourceArn: !Ref AlertTopic
     
  ElasticIP:
    Type: AWS::EC2::EIP

    Properties:
      Domain: vpc

  ElasticIPAssociation:
    Type: AWS::EC2::EIPAssociation

    Properties:
      AllocationId: !GetAtt ElasticIP.AllocationId
      InstanceId: !Ref K8Master

Outputs:

  InstanceId:
    Description: EC2 Instance ID
    Value: !Ref K8Master

  PublicIP:
    Description: Public Elastic IP
    Value: !Ref ElasticIP

  KubernetesNode:
    Description: Kubernetes Node Name
    Value: kube-master

  SSHCommand:
    Description: SSH Command
    Value: !Sub "ssh ubuntu@${ElasticIP}"

  ECRRepositoryUri:
    Description: ECR Repository URI
    Value: !GetAtt ECRRepository.RepositoryUri

  SNSTopicArn:
    Description: SNS Topic ARN
    Value: !Ref AlertTopic

  LambdaFunction:
    Description: Lambda Function Name
    Value: !Ref AlertLambda

  DynamoDBTable:
    Description: DynamoDB Table Name
    Value: !Ref AlarmEventsTable
