name: Build and Deploy

on:
  push:
    branches:
      - main

env:
  STACK_NAME: kubernetes-assignment

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy CloudFormation Stack
        run: |
          aws cloudformation deploy \
            --template-file infra/cloudformation.yaml \
            --stack-name $STACK_NAME \
            --capabilities CAPABILITY_NAMED_IAM\
            --parameter-overrides \
              KeyPairName=k8s-assignment-key

      - name: Get Stack Outputs
        run: |

          ECR_URI=$(aws cloudformation describe-stacks \
            --stack-name $STACK_NAME \
            --query "Stacks[0].Outputs[?OutputKey=='ECRRepositoryUri'].OutputValue" \
            --output text)

          EC2_IP=$(aws cloudformation describe-stacks \
            --stack-name $STACK_NAME \
            --query "Stacks[0].Outputs[?OutputKey=='PublicIP'].OutputValue" \
            --output text)

          echo "ECR_URI=$ECR_URI" >> $GITHUB_ENV
          echo "EC2_IP=$EC2_IP" >> $GITHUB_ENV

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Get ECR Login Password
        run: |
          echo "ECR_PASSWORD=$(aws ecr get-login-password --region ${{ secrets.AWS_REGION }})" >> $GITHUB_ENV

      - name: Build Docker Image
        run: |
          docker build -t flask-k8s-app -f app/Dockerfile app

      - name: Tag Docker Image
        run: |
          docker tag flask-k8s-app:latest \
          $ECR_URI:${{ github.sha }}

      - name: Push Docker Image
        run: |
          docker push $ECR_URI:${{ github.sha }}

      - name: Create SSH Key
        run: |
          echo "${{ secrets.EC2_PRIVATE_KEY }}" > private_key
          chmod 600 private_key
          
      - name: Wait For Kubernetes Bootstrap
        run: |
          ssh -o StrictHostKeyChecking=no \
          -i private_key \
          ubuntu@$EC2_IP \
          "sudo cloud-init status --wait"

      - name: Copy K8s Manifests
        run: |
          scp -o StrictHostKeyChecking=no \
              -i private_key \
              -r K8s \
              ubuntu@$EC2_IP:/home/ubuntu/
              
      - name: Deploy to Kubernetes
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -i private_key \
            ubuntu@$EC2_IP << EOF

          set -eux

          export KUBECONFIG=/home/ubuntu/.kube/config

          cloud-init status

          kubectl get nodes

          ls -R /home/ubuntu/K8s

          kubectl get ns

          kubectl create namespace app \
          --dry-run=client \
          -o yaml \
          | kubectl apply -f -

          kubectl create secret generic app-secret --from-literal=password="${{ secrets.APP_PASSWORD }}" -n app --dry-run=client -o yaml | kubectl apply -f -


          kubectl create secret docker-registry ecr-secret \
          --docker-server=$ECR_URI \
          --docker-username=AWS \
          --docker-password='$ECR_PASSWORD' \
          -n app \
          --dry-run=client -o yaml | kubectl apply -f -

          sed -i "s|IMAGE_PLACEHOLDER|$ECR_URI:${{ github.sha }}|g" \
          /home/ubuntu/K8s/deployment.yaml

          echo "Deployment image:"
          grep "image:" /home/ubuntu/K8s/deployment.yaml

          echo "Waiting for ingress controller..."

          echo "Ingress controller status"

          kubectl get pods -n ingress-nginx

          kubectl apply -f /home/ubuntu/K8s/configmap.yaml -n app

          echo "Validating deployment yaml"
          cat /home/ubuntu/K8s/deployment.yaml | head -30

          kubectl apply -f /home/ubuntu/K8s/deployment.yaml -n app

          kubectl apply -f /home/ubuntu/K8s/service.yaml -n app

          kubectl apply -f /home/ubuntu/K8s/hpa.yaml -n app

          kubectl apply -f /home/ubuntu/K8s/ingress.yaml -n app || true

          echo "================ PODS ================"
          kubectl get pods -n app
          echo "================ SECRETS ================"
          kubectl get secret -n app
          echo "================ DEPLOYMENT ================"
          kubectl describe deployment assignment-app -n app
          echo "================ IMAGE PULL SECRETS ================"
          kubectl get deployment assignment-app -n app -o yaml | grep -A5 imagePullSecrets || true
          echo "================ POD DETAILS ================"
          kubectl describe pods -n app || true
          echo "Waiting 60 seconds before checking rollout..."
          sleep 60

          kubectl get pods -n app -o wide

          kubectl describe pods -n app
          
          kubectl rollout status deployment/assignment-app \
          -n app \
          --timeout=300s

          kubectl get all -n app

          EOF

      - name: Install Prometheus and Grafana
        run: |
              ssh \
                -o StrictHostKeyChecking=no \
                -i private_key \
                ubuntu@$EC2_IP << 'EOF'

              export KUBECONFIG=/home/ubuntu/.kube/config

              if ! command -v helm >/dev/null 2>&1
              then
                curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
              fi

              helm repo add prometheus-community \
                https://prometheus-community.github.io/helm-charts

              helm repo update

              kubectl create namespace monitoring \
              --dry-run=client -o yaml | kubectl apply -f -

              helm upgrade --install monitoring \
              prometheus-community/kube-prometheus-stack \
              -n monitoring

              EOF

      - name: Verify Monitoring Stack
        run: |
              ssh \
                -o StrictHostKeyChecking=no \
                -i private_key \
                ubuntu@$EC2_IP << 'EOF'

              export KUBECONFIG=/home/ubuntu/.kube/config

              echo "===== Monitoring Pods ====="

              kubectl get pods -n monitoring

              echo "===== Waiting ====="

              sleep 30

              kubectl wait --for=condition=Ready pod --all -n monitoring --timeout=200s || true

              kubectl get pods -n monitoring

              echo "===== Prometheus Check ====="

              kubectl port-forward \
                -n monitoring \
                prometheus-monitoring-kube-prometheus-prometheus-0 \
                9090:9090 >/tmp/prometheus.log 2>&1 &

              sleep 20

              curl http://localhost:9090/-/healthy

              curl http://localhost:9090/-/ready

              EOF
